<style>
/* Layout: ledger of the day. A dark header carries date and a segmented progress strip, task cards read like lines in the paper log (start, finish, duration). */
:root{
  --bg:#EDF2F2; --surface:#FFFFFF; --surface-2:#E6EDEE; --ink:#10293A; --ink-2:#51697A; --line:#D2DEDF;
  --hero:#0E2B3B; --hero-ink:#F2F8F8; --hero-ink-2:#9DB8C4;
  --accent:#0B7F7B; --accent-ink:#FFFFFF; --accent-soft:#D5EEEC;
  --doing:#A85A06; --doing-soft:#FBE8CC;
  --done:#1B7A3B; --done-soft:#D8F0DF;
  --hold:#6446B0; --hold-soft:#E7E0F7;
  --new:#556B79; --new-soft:#E2E9EC;
  --danger:#B3261E; --danger-soft:#FBE0DE;
  --shadow:0 1px 2px rgba(16,41,58,.06),0 6px 18px rgba(16,41,58,.06);
  --font:"SF Arabic","Noto Sans Arabic","Noto Kufi Arabic","Segoe UI","Geeza Pro",Tahoma,system-ui,-apple-system,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A171F; --surface:#112530; --surface-2:#173340; --ink:#E6F0F2; --ink-2:#9FB6C0; --line:#23424F;
    --hero:#12303D; --hero-ink:#F2F8F8; --hero-ink-2:#9DB8C4;
    --accent:#3CC4BC; --accent-ink:#04211F; --accent-soft:#12403F;
    --doing:#F0B35A; --doing-soft:#3A2A10;
    --done:#5CCB82; --done-soft:#12351F;
    --hold:#B7A0F0; --hold-soft:#2A2142;
    --new:#9FB6C0; --new-soft:#1B3340;
    --danger:#FF8A80; --danger-soft:#3E1816;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:light dark}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
bdi,.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.wrap{max-width:560px;margin-inline:auto}

/* header */
.hero{background:var(--hero);color:var(--hero-ink);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 22px;border-radius:0 0 26px 26px}
.hero .wrap{display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.brand span{display:block;font-size:12.5px;color:var(--hero-ink-2)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--hero-ink);background:rgba(255,255,255,.1)}
.icon-btn:active{background:rgba(255,255,255,.2)}
.dateline{display:flex;flex-direction:column;gap:2px}
.dateline .hello{font-size:14px;color:var(--hero-ink-2)}
.dateline .day{font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance}
.progress{display:flex;flex-direction:column;gap:10px}
.progress .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--hero-ink-2)}
.progress .meta strong{font-size:20px;color:var(--hero-ink);font-weight:700}
.segs{display:flex;gap:4px}
.seg{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18);min-width:4px}
.seg.doing{background:#F0B35A}.seg.done{background:#5CCB82}.seg.hold{background:#B7A0F0}

/* content */
main{padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 104px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:16px;background:var(--surface-2);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--done);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
@media (prefers-color-scheme: dark){.btn.done{color:#06220F}}
.filters{display:flex;gap:8px;overflow-x:auto;margin:14px -16px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip-f{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip-f .n{font-size:13px;opacity:.85}
.chip-f[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:flex-start;gap:8px}
.card-h h3{flex:1;margin:0;font-size:18px;line-height:1.4;font-weight:700;overflow-wrap:anywhere;min-width:0}
.dots{width:44px;height:44px;margin:-8px -8px -8px 0;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.dots:active{background:var(--surface-2)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.doing{background:var(--doing-soft);color:var(--doing)}
.tag.done{background:var(--done-soft);color:var(--done)}
.tag.hold{background:var(--hold-soft);color:var(--hold)}
.tag.bell{background:var(--surface-2);color:var(--ink-2)}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.ledger{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-2);border-radius:12px;overflow:hidden}
.ledger div{padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ledger div+div{border-inline-start:1.5px dashed var(--line)}
.ledger small{font-size:12px;color:var(--ink-2)}
.ledger b{font-size:15px;font-weight:700}
.ledger b.empty{color:var(--ink-2);font-weight:400}
.note{margin:0;font-size:14.5px;color:var(--ink-2);background:var(--bg);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.note b{color:var(--ink);font-weight:600}
.empty-state{text-align:center;padding:36px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-2)}
.empty-state h3{margin:0;color:var(--ink);font-size:19px}
.empty-state p{margin:0;max-width:30ch}
.sec-title{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;margin:0}

/* tabbar */
.tabbar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20}
.tabbar .wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{min-height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* report */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.paper-h{padding:16px;border-bottom:2px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.paper-h h2{margin:0;font-size:20px}
.paper-h p{margin:0;color:var(--ink-2);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px dashed var(--line)}
.stats div{padding:12px 6px;text-align:center;display:flex;flex-direction:column}
.stats div+div{border-inline-start:1.5px dashed var(--line)}
.stats b{font-size:22px;line-height:1.2}
.stats small{font-size:12px;color:var(--ink-2)}
.stats .s-done b{color:var(--done)}.stats .s-doing b{color:var(--doing)}.stats .s-hold b{color:var(--hold)}.stats .s-new b{color:var(--new)}
.line{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.line+.line{border-top:1.5px dashed var(--line)}
.line h4{margin:0;font-size:16.5px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.times{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2)}
.times b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,18,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h2{margin:0;font-size:20px}
.sheet .sub{margin:-8px 0 0;color:var(--ink-2);font-size:14.5px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--ink-2)}
.input{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--danger);font-size:13.5px;margin:0}
.hint{font-size:13.5px;color:var(--ink-2);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14.5px}
.setrow span{color:var(--ink-2)}

/* welcome */
.welcome{min-height:100dvh;display:flex;flex-direction:column}
.welcome .hero{padding-bottom:34px}
.welcome form{padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px}

/* banners and toast */
#banners{position:fixed;inset-inline:0;top:0;z-index:60;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.banner{pointer-events:auto;max-width:536px;width:100%;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:down .25s ease}
.banner p{margin:0;font-weight:600}
.banner p small{display:block;font-weight:400;opacity:.8;font-size:13.5px}
.banner .row{gap:8px}
.banner .btn{min-height:42px;font-size:15px;flex:1}
.banner .btn.light{background:rgba(255,255,255,.16);color:inherit}
.install{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;font-size:14.5px}
.install p{margin:0}
#toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;justify-content:center;z-index:70;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes down{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="banners" aria-live="assertive"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
const KEY='hm.app.v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR={new:'لم تبدأ',doing:'جارٍ',done:'تمت',hold:'مؤجلة'};
const EMO={new:'⏳',doing:'🔄',done:'✅',hold:'⏸'};

/* ---------- storage ---------- */
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return Object.assign({worker:null,tasks:[],logs:{}},r)}catch(e){}
  return {worker:null,tasks:[],logs:{}};
}
let saveFailed=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false}
  catch(e){if(!saveFailed)toast('تعذر حفظ البيانات على الجهاز');saveFailed=true}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- time helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm=(d=new Date())=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function t12(v){
  let h,m;
  if(v.length===5&&v[2]===':'){[h,m]=v.split(':').map(Number)}else{const d=new Date(v);h=d.getHours();m=d.getMinutes()}
  return `${h%12||12}:${pad(m)} ${h>=12?'م':'ص'}`;
}
function dur(a,b){
  if(!a||!b)return '';
  const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));
  if(m<1)return 'أقل من دقيقة';
  if(m<60)return `${m} دقيقة`;
  const h=Math.floor(m/60),r=m%60;
  return r?`${h} ساعة و${r} دقيقة`:`${h} ساعة`;
}
function dateLong(d=new Date()){
  try{return d.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
  catch(e){return d.toDateString()}
}
function dateDay(d=new Date()){
  try{return d.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}
  catch(e){return d.toDateString()}
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const digits=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

/* ---------- data ---------- */
let today=dkey();
function ensureToday(){
  today=dkey();
  const L=S.logs[today]||(S.logs[today]=[]);
  S.tasks.forEach(t=>{
    if(!L.some(e=>e.id===t.id))L.push({id:t.id,title:t.title,remind:t.remind||'',status:'new',start:null,end:null,note:'',alerted:false});
  });
  const keep=Object.keys(S.logs).sort().slice(-45);
  Object.keys(S.logs).forEach(k=>{if(!keep.includes(k))delete S.logs[k]});
  save();
}
const log=()=>S.logs[today]||(S.logs[today]=[]);
const entry=id=>log().find(e=>e.id===id);
function counts(){
  const c={all:0,new:0,doing:0,done:0,hold:0};
  log().forEach(e=>{c.all++;c[e.status]++});
  return c;
}

/* ---------- icons ---------- */
const P={
  bell:'<path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 19a2 2 0 0 0 4 0"/>',
  dots:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  play:'<path d="M8 5l11 7-11 7z"/>',
  share:'<path d="M12 3v12M7.5 7.5L12 3l4.5 4.5M5 13v7h14v-7"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V5a2 2 0 0 1 2-2h9v1"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const ic=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const MARK='<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#0B7F7B"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="#fff" stroke-width="3.2" opacity=".95"/><path d="M18.5 24.5l4 4 7.5-8.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- ui state ---------- */
const ui={tab:'tasks',filter:'all',installHidden:false,deferred:null};
try{ui.installHidden=localStorage.getItem('hm.installHidden')==='1'}catch(e){}
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* ---------- render ---------- */
function render(){
  const root=$('#root');
  if(!S.worker){root.innerHTML=welcomeHTML();return}
  ensureToday();
  root.innerHTML=`
  <header class="hero"><div class="wrap">
    <div class="top">
      <div class="brand">${MARK}<div><b>مواعيد HM</b><span>كلين أتش أم</span></div></div>
      <button class="icon-btn" data-act="account" aria-label="بياناتي">${ic('user')}</button>
    </div>
    ${heroBody()}
  </div></header>
  <main class="wrap" id="main">${ui.tab==='tasks'?tasksHTML():reportHTML()}</main>
  <nav class="tabbar" aria-label="التنقل"><div class="wrap">
    <button class="tab" data-act="tab" data-v="tasks" ${ui.tab==='tasks'?'aria-current="page"':''}>${ic('list')}مهمات اليوم</button>
    <button class="tab" data-act="tab" data-v="report" ${ui.tab==='report'?'aria-current="page"':''}>${ic('doc')}التقرير</button>
  </div></nav>`;
}
function heroBody(){
  const c=counts(),first=(S.worker.name||'').trim().split(/\s+/)[0]||'';
  return `
    <div class="dateline"><span class="hello">أهلاً ${esc(first)}</span><span class="day">${esc(dateDay())}</span></div>
    <div class="progress">
      <div class="meta"><span>المنجز اليوم</span><span><strong class="num">${c.done}</strong> من <bdi class="num">${c.all}</bdi></span></div>
      <div class="segs" role="img" aria-label="تمت ${c.done} من ${c.all} مهمات">${log().map(e=>`<i class="seg ${e.status}"></i>`).join('')||'<i class="seg"></i>'}</div>
    </div>`;
}
function welcomeHTML(){
  return `<div class="welcome">
    <header class="hero"><div class="wrap">
      <div class="brand">${MARK}<div><b>مواعيد HM</b><span>كلين أتش أم</span></div></div>
      <div class="dateline"><span class="hello">مرحبًا بك</span><span class="day">سجّل مواعيد مهماتك في مكان واحد</span></div>
    </div></header>
    <form class="wrap" data-form="worker" novalidate>
      <p class="hint" style="font-size:15px">اكتب اسمك ورقم هاتفك مرة واحدة فقط. يظهران في تقرير المواعيد ولا يُستخدمان لتسجيل حساب.</p>
      <div class="field"><label for="w-name">الاسم</label><input class="input" id="w-name" autocomplete="name" placeholder="الاسم بالكامل"></div>
      <div class="field"><label for="w-phone">رقم الهاتف</label><input class="input" id="w-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right"></div>
      <p class="err" id="w-err" hidden></p>
      <button class="btn primary block" type="submit">ابدأ الاستخدام</button>
    </form></div>`;
}
function installHTML(){
  if(isStandalone()||ui.installHidden)return '';
  let msg,btn='';
  if(ui.deferred){msg='ثبّت التطبيق على الشاشة الرئيسية ليعمل بدون إنترنت.';btn=`<button class="btn primary" data-act="install">تثبيت التطبيق</button>`}
  else if(isIOS()){msg='لتثبيت التطبيق على الآيفون: اضغط زر المشاركة في Safari ثم اختر «إضافة إلى الشاشة الرئيسية».'}
  else{msg='لتثبيت التطبيق: افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».'}
  return `<div class="install"><p>${msg}</p><div class="row">${btn}<button class="btn ghost" data-act="hide-install">إخفاء</button></div></div>`;
}
function tasksHTML(){
  const c=counts(),L=log();
  const f=ui.filter;
  const shown=f==='all'?L:L.filter(e=>e.status===f);
  const fl=[['all','الكل'],['new','لم تبدأ'],['doing','جارٍ'],['done','تمت'],['hold','مؤجلة']];
  return `${installHTML()}
  <div class="row between"><h2 class="sec-title" style="font-size:15px">قائمة اليوم</h2>
  <button class="btn primary" data-act="add">${ic('plus',20)}إضافة مهمة</button></div>
  <div class="filters" role="group" aria-label="تصفية المهمات">${fl.map(([k,l])=>`<button class="chip-f" data-act="filter" data-v="${k}" aria-pressed="${f===k}">${l}<span class="n num">${c[k]}</span></button>`).join('')}</div>
  <div class="list">${shown.length?shown.map(cardHTML).join(''):emptyHTML(L.length)}</div>`;
}
function emptyHTML(total){
  if(total)return `<div class="empty-state"><h3>لا توجد مهمات في هذه الحالة</h3><p>اختر «الكل» لعرض جميع مهمات اليوم.</p></div>`;
  return `<div class="empty-state"><h3>لم تُضف مهمات بعد</h3><p>اضغط «إضافة مهمة» واكتب أول مهمة. تُحفظ المهمات وتظهر كل يوم تلقائيًا.</p></div>`;
}
function cardHTML(e){
  const late=e.remind&&(e.status==='new'||e.status==='hold')&&e.remind<=hhmm();
  const d=dur(e.start,e.end);
  let act='';
  if(e.status==='new'||e.status==='hold')act=`<button class="btn primary block" data-act="start" data-id="${e.id}">${ic('play',20)}بدء المهمة</button>`;
  else if(e.status==='doing')act=`<button class="btn done block" data-act="finish" data-id="${e.id}">${ic('check',22)}تسجيل الإنجاز</button>`;
  return `<article class="card">
    <div class="card-h"><h3>${esc(e.title)}</h3><button class="dots" data-act="edit" data-id="${e.id}" aria-label="خيارات المهمة">${ic('dots')}</button></div>
    <div class="tags"><span class="tag ${e.status}">${AR[e.status]}</span>${e.remind?`<span class="tag ${late?'late':'bell'}">${ic('bell',14)}<bdi class="num">${t12(e.remind)}</bdi></span>`:''}</div>
    <div class="ledger">
      <div><small>البدء</small><b class="${e.start?'':'empty'} num">${e.start?t12(e.start):'غير مسجل'}</b></div>
      <div><small>الإنجاز</small><b class="${e.end?'':'empty'} num">${e.end?t12(e.end):'غير مسجل'}</b></div>
      <div><small>المدة</small><b class="${d?'':'empty'}">${d||'غير محسوبة'}</b></div>
    </div>
    ${e.note?`<p class="note"><b>ملاحظة:</b> ${esc(e.note)}</p>`:''}
    ${act}
  </article>`;
}
function reportHTML(){
  const c=counts(),L=log();
  return `<div class="actions">
    <button class="btn primary block" data-act="share" ${L.length?'':'disabled'}>${ic('share',20)}مشاركة التقرير على واتساب</button>
    <button class="btn ghost block" data-act="copy" ${L.length?'':'disabled'}>${ic('copy',20)}نسخ نص التقرير</button>
    <p class="hint">تظهر قائمة المشاركة وتختار منها مجموعة واتساب بنفسك.</p>
  </div>
  <section class="paper" aria-label="تقرير اليوم">
    <div class="paper-h"><h2>تقرير المواعيد HM</h2><p>${esc(dateLong())}</p><p>${esc(S.worker.name)} ، <bdi class="num">${esc(S.worker.phone)}</bdi></p></div>
    <div class="stats">
      <div class="s-done"><b class="num">${c.done}</b><small>تمت</small></div>
      <div class="s-doing"><b class="num">${c.doing}</b><small>جارٍ</small></div>
      <div class="s-hold"><b class="num">${c.hold}</b><small>مؤجلة</small></div>
      <div class="s-new"><b class="num">${c.new}</b><small>لم تبدأ</small></div>
    </div>
    ${L.length?L.map(e=>`<div class="line">
      <div class="row between" style="align-items:flex-start"><h4>${esc(e.title)}</h4><span class="tag ${e.status}">${AR[e.status]}</span></div>
      <div class="times"><span>البدء: <b class="num">${e.start?t12(e.start):'غير مسجل'}</b></span><span>الإنجاز: <b class="num">${e.end?t12(e.end):'غير مسجل'}</b></span>${dur(e.start,e.end)?`<span>المدة: <b>${dur(e.start,e.end)}</b></span>`:''}</div>
      ${e.note?`<p class="note"><b>ملاحظة:</b> ${esc(e.note)}</p>`:''}
    </div>`).join(''):`<div class="empty-state"><h3>لا توجد مواعيد مسجلة</h3><p>أضف مهمات اليوم وسجّل البدء والإنجاز ثم ارجع هنا للتقرير.</p></div>`}
  </section>`;
}
function reportText(){
  const c=counts(),L=log(),sep='━━━━━━━━━━━━';
  const out=[`*تقرير المواعيد HM*`,`كلين أتش أم`,sep,`التاريخ: ${dateLong()}`,`العامل: ${S.worker.name}`,`الهاتف: ${S.worker.phone}`,sep,
    `الملخص: تمت ${c.done} من ${c.all}`+(c.doing?` | جارٍ ${c.doing}`:'')+(c.hold?` | مؤجلة ${c.hold}`:'')+(c.new?` | لم تبدأ ${c.new}`:''),sep];
  L.forEach((e,i)=>{
    out.push(`*${i+1}) ${e.title}* ${EMO[e.status]} ${AR[e.status]}`);
    out.push(`البدء: ${e.start?t12(e.start):'غير مسجل'}`);
    out.push(`الإنجاز: ${e.end?t12(e.end):'غير مسجل'}`);
    if(dur(e.start,e.end))out.push(`المدة: ${dur(e.start,e.end)}`);
    if(e.note)out.push(`ملاحظة: ${e.note}`);
    out.push('');
  });
  return out.join('\n').trim();
}

/* ---------- sheets ---------- */
function openSheet(html){
  const s=$('#sheet');
  s.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const first=$('.input',s);if(first&&!/Mobi|Android|iPhone/i.test(navigator.userAgent))first.focus();
}
function closeSheet(){$('#sheet').innerHTML=''}
function taskSheet(id){
  const e=id?entry(id):null;
  openSheet(`
    <div class="row between"><h2>${e?'تعديل المهمة':'مهمة جديدة'}</h2><button class="icon-btn" style="background:var(--surface-2);color:var(--ink)" data-act="close" aria-label="إغلاق">${ic('close')}</button></div>
    <div class="field"><label for="f-title">اسم المهمة</label><input class="input" id="f-title" maxlength="120" placeholder="مثال: تنظيف الحمامات" value="${esc(e?e.title:'')}"></div>
    <div class="field"><label for="f-remind">وقت التنبيه (اختياري)</label>
      <div class="row"><input class="input" id="f-remind" type="time" value="${esc(e?e.remind:'')}" style="flex:1"><button class="btn ghost" type="button" data-act="clear-remind">مسح</button></div>
      <p class="hint">ينبهك التطبيق في هذا الوقت كل يوم لتسجّل موعد المهمة.</p></div>
    <div class="field"><label for="f-note">ملاحظة اليوم (اختياري)</label><textarea class="input" id="f-note" maxlength="300" placeholder="أي تفاصيل تريد إضافتها في التقرير">${esc(e?e.note:'')}</textarea></div>
    <p class="err" id="f-err" hidden></p>
    <button class="btn primary block" data-act="save-task" data-id="${e?e.id:''}">حفظ</button>
    ${e?`<div class="two">
        ${e.status!=='done'&&e.status!=='hold'?`<button class="btn" data-act="hold" data-id="${e.id}">${ic('pause',18)}تأجيل</button>`:'<span></span>'}
        ${e.status!=='new'?`<button class="btn" data-act="reset" data-id="${e.id}">${ic('undo',18)}إعادة ضبط</button>`:'<span></span>'}
      </div>
      <button class="btn danger block" id="del-ask" data-act="del-ask">${ic('trash',18)}حذف المهمة</button>
      <div id="del-box" hidden style="display:flex;flex-direction:column;gap:10px">
        <p class="hint">تُحذف المهمة من قائمة الأيام القادمة. إن كانت مسجلة بالإنجاز اليوم تبقى في تقرير اليوم.</p>
        <div class="two"><button class="btn danger" data-act="del-yes" data-id="${e.id}">تأكيد الحذف</button><button class="btn" data-act="del-no">تراجع</button></div>
      </div>`:''}
  `);
  const box=$('#del-box');if(box)box.hidden=true;
}
function accountSheet(){
  const w=S.worker;
  const np=('Notification' in window)?Notification.permission:'unsupported';
  const nTxt=np==='granted'?'مفعلة':np==='denied'?'محظورة من إعدادات الجهاز':np==='unsupported'?'غير مدعومة على هذا الجهاز':'غير مفعلة';
  openSheet(`
    <div class="row between"><h2>بياناتي</h2><button class="icon-btn" style="background:var(--surface-2);color:var(--ink)" data-act="close" aria-label="إغلاق">${ic('close')}</button></div>
    <p class="sub">الاسم والهاتف للتعريف في التقرير فقط.</p>
    <div class="field"><label for="a-name">الاسم</label><input class="input" id="a-name" value="${esc(w.name)}"></div>
    <div class="field"><label for="a-phone">رقم الهاتف</label><input class="input" id="a-phone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" value="${esc(w.phone)}"></div>
    <p class="err" id="a-err" hidden></p>
    <button class="btn primary block" data-act="save-account">حفظ البيانات</button>
    <div class="setrow"><div>إشعارات الجهاز<br><span>${nTxt}</span></div>${np==='default'?`<button class="btn" data-act="notif">تفعيل</button>`:''}</div>
    <p class="hint">التنبيهات تعمل أثناء فتح التطبيق، وتظهر كإشعار إذا سمح الجهاز بذلك.</p>
  `);
}

/* ---------- actions ---------- */
function toast(m){
  const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`;
  clearTimeout(toast.t);toast.t=setTimeout(()=>{t.innerHTML=''},2200);
}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setReminderFlag(e){e.alerted=!!(e.remind&&e.remind<=hhmm())}

function act(a,el,ev){
  const id=el.dataset.id;
  switch(a){
    case 'tab':ui.tab=el.dataset.v;render();window.scrollTo(0,0);break;
    case 'filter':ui.filter=el.dataset.v;render();break;
    case 'account':accountSheet();break;
    case 'add':taskSheet();break;
    case 'edit':taskSheet(id);break;
    case 'close':closeSheet();break;
    case 'scrim':if(el===ev.target)closeSheet();break;
    case 'clear-remind':$('#f-remind').value='';break;
    case 'start':{const e=entry(id);if(!e)break;e.status='doing';e.start=new Date().toISOString();e.end=null;save();render();toast(`تم تسجيل البدء ${t12(e.start)}`);vib(30);dismissBanner(id);break}
    case 'finish':{const e=entry(id);if(!e)break;e.status='done';e.end=new Date().toISOString();save();render();toast(`تم تسجيل الإنجاز ${t12(e.end)}`);vib([30,40,30]);break}
    case 'hold':{const e=entry(id);if(!e)break;e.status='hold';e.end=null;save();closeSheet();render();toast('تم تأجيل المهمة');break}
    case 'reset':{const e=entry(id);if(!e)break;e.status='new';e.start=null;e.end=null;save();closeSheet();render();toast('أُعيدت المهمة إلى لم تبدأ');break}
    case 'del-ask':$('#del-ask').hidden=true;$('#del-box').hidden=false;break;
    case 'del-no':$('#del-ask').hidden=false;$('#del-box').hidden=true;break;
    case 'del-yes':{
      S.tasks=S.tasks.filter(t=>t.id!==id);
      const e=entry(id);
      if(e&&(e.status==='new'||e.status==='hold'))S.logs[today]=log().filter(x=>x.id!==id);
      save();closeSheet();render();toast('تم حذف المهمة');break}
    case 'save-task':saveTask(id);break;
    case 'save-account':saveAccount();break;
    case 'notif':askNotif().then(accountSheet);break;
    case 'share':shareReport();break;
    case 'copy':copyReport();break;
    case 'install':if(ui.deferred){ui.deferred.prompt();ui.deferred.userChoice.finally(()=>{ui.deferred=null;render()})}break;
    case 'hide-install':ui.installHidden=true;try{localStorage.setItem('hm.installHidden','1')}catch(e){}render();break;
    case 'banner-close':dismissBanner(id);break;
  }
}
function saveTask(id){
  const title=$('#f-title').value.trim(),remind=$('#f-remind').value||'',note=$('#f-note').value.trim(),err=$('#f-err');
  if(!title){err.textContent='اكتب اسم المهمة أولًا.';err.hidden=false;$('#f-title').focus();return}
  if(id){
    const t=S.tasks.find(x=>x.id===id),e=entry(id);
    if(t){t.title=title;t.remind=remind}
    if(e){const changed=e.remind!==remind;e.title=title;e.remind=remind;e.note=note;if(changed)setReminderFlag(e)}
  }else{
    const t={id:uid(),title,remind};
    S.tasks.push(t);
    const e={id:t.id,title,remind,status:'new',start:null,end:null,note,alerted:false};
    setReminderFlag(e);log().push(e);
  }
  save();closeSheet();render();toast(id?'تم حفظ التعديل':'تمت إضافة المهمة');
  if(remind)askNotif();
}
function validPhone(p){return digits(p).replace(/[\s\-+()]/g,'').replace(/\D/g,'').length>=8}
function saveWorker(){
  const name=$('#w-name').value.trim(),phone=digits($('#w-phone').value).trim(),err=$('#w-err');
  if(!name){err.textContent='اكتب اسمك.';err.hidden=false;return}
  if(!validPhone(phone)){err.textContent='اكتب رقم هاتف صحيح.';err.hidden=false;return}
  S.worker={name,phone};save();render();
}
function saveAccount(){
  const name=$('#a-name').value.trim(),phone=digits($('#a-phone').value).trim(),err=$('#a-err');
  if(!name){err.textContent='اكتب الاسم.';err.hidden=false;return}
  if(!validPhone(phone)){err.textContent='اكتب رقم هاتف صحيح.';err.hidden=false;return}
  S.worker={name,phone};save();closeSheet();render();toast('تم حفظ بياناتك');
}
async function shareReport(){
  const text=reportText();
  if(navigator.share){
    try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  window.location.href='https://wa.me/?text='+encodeURIComponent(text);
}
async function copyReport(){
  const text=reportText();
  try{await navigator.clipboard.writeText(text);toast('تم نسخ التقرير');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('تم نسخ التقرير')}catch(e){toast('تعذر النسخ، استخدم زر المشاركة')}
  ta.remove();
}

/* ---------- reminders ---------- */
async function askNotif(){
  try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}
}
const shownBanners=new Set();
function showBanner(e){
  if(shownBanners.has(e.id))return;shownBanners.add(e.id);
  const b=document.createElement('div');b.className='banner';b.dataset.bid=e.id;
  b.innerHTML=`<p>حان موعد المهمة<small>${esc(e.title)} · <bdi class="num">${t12(e.remind)}</bdi></small></p>
    <div class="row"><button class="btn done" data-act="start" data-id="${e.id}">${ic('play',18)}بدء الآن</button><button class="btn light" data-act="banner-close" data-id="${e.id}">لاحقًا</button></div>`;
  $('#banners').appendChild(b);
}
function dismissBanner(id){
  const b=$(`#banners [data-bid="${id}"]`);if(b)b.remove();shownBanners.delete(id);
}

function tick(){
  if(!S.worker)return;
  if(dkey()!==today){ensureToday();shownBanners.clear();$('#banners').innerHTML='';render();return}
  const now=hhmm();let fired=false;
  log().forEach(e=>{
    if(e.remind&&!e.alerted&&e.remind<=now&&(e.status==='new'||e.status==='hold')){
      e.alerted=true;fired=true;showBanner(e);pushNotif(e);vib([250,120,250]);
    }
  });
  if(fired){save();render()}
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el)return;
  act(el.dataset.act,el,ev);
});
document.addEventListener('submit',ev=>{
  if(ev.target.dataset.form==='worker'){ev.preventDefault();saveWorker()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();ui.deferred=ev;if(S.worker&&ui.tab==='tasks'&&!$('#sheet').innerHTML)render()});
window.addEventListener('appinstalled',()=>{ui.deferred=null;ui.installHidden=true;render()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

render();
tick();
setInterval(tick,15000);
})();
</script>
